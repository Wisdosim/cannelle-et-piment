version: '3.8'

services:
  app:
    build: .
    container_name: cannelle-et-piment-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=3000
    volumes:
      - db-data:/app/prisma
    restart: unless-stopped

volumes:
  db-data:
    driver: local
